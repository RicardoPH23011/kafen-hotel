<app-hero></app-hero>

<section class="experience-intro">
  <div class="booking-frame">

    <div class="field">
      <label>Check in</label>
      <input
        type="date"
        [value]="checkIn"
        (change)="onCheckInChange($event.target.value)"
      />
    </div>

    <div class="field">
      <label>Check out</label>
      <input
        type="date"
        [value]="checkOut"
        [min]="minCheckOut"
        (change)="onCheckOutChange($event.target.value)"
      />
    </div>

    <button>BOOK</button>
  </div>

  <h2>UNA EXPERIENCIA ÚNICA Y ROMÁNTICA</h2>
</section>
